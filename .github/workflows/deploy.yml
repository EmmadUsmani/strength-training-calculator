name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a deploy to be re-run by hand from the Actions tab.
  workflow_dispatch:

# Read the repo, mint the Pages OIDC token the deploy step needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a queued run supersede an older one, but never
# cancel a deploy that is already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Build
        # Project pages are served from /<repo>, so the app needs that prefix.
        run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
